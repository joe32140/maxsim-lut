name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      - name: list the kernels the unit test exercised on this runner
        run: cargo test --lib every_supported_kernel -- --nocapture 2>&1 | grep "kernels exercised"
      - name: test forced-scalar path
        run: cargo test
        env:
          MAXSIM_LUT_FORCE_SCALAR: "1"
      - name: report the kernel this runner dispatches to
        run: cargo run --release --example bench -- 128 4 32 240 256

  no-simd-target:
    name: check (wasm32, scalar only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check --all-targets
